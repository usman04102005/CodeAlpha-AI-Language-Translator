<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator | CodeAlpha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .translator-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .input-group select,
        .input-group textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
            resize: vertical;
        }
        
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group textarea {
            min-height: 150px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            grid-column: 1 / -1;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-translate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-translate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-copy {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }
        
        .btn-copy:hover {
            background: #e0e0e0;
        }
        
        .btn-clear {
            background: #ff6b6b;
            color: white;
            flex: 1;
        }
        
        .btn-clear:hover {
            background: #ff5252;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .tts-button {
            background: #4CAF50;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 10px;
            width: 100%;
        }
        
        .tts-button:hover {
            background: #45a049;
        }
        
        @media (max-width: 768px) {
            .translator-section {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 AI Language Translator</h1>
            <p>Powered by CodeAlpha | Real-time Translation</p>
        </div>
        
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <div class="loader" id="loader"><div class="spinner"></div></div>
        
        <div class="translator-section">
            <div class="input-group">
                <label for="sourceLang">Source Language</label>
                <select id="sourceLang">
                    <option value="auto">Auto-detect</option>
                </select>
                
                <label for="sourceText" style="margin-top: 15px;">Text to Translate</label>
                <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
                <button class="tts-button" onclick="speakSource()">🔊 Speak Source Text</button>
            </div>
            
            <div class="input-group">
                <label for="targetLang">Target Language</label>
                <select id="targetLang">
                    <option value="en">English</option>
                </select>
                
                <label for="translatedText" style="margin-top: 15px;">Translated Text</label>
                <textarea id="translatedText" placeholder="Translation will appear here..." readonly></textarea>
                <button class="tts-button" onclick="speakTranslated()">🔊 Speak Translation</button>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-translate" onclick="translateText()">Translate 🚀</button>
            <button class="btn-copy" onclick="copyToClipboard()">Copy Translation 📋</button>
            <button class="btn-clear" onclick="clearAll()">Clear All 🗑️</button>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        // Load languages on page load
        document.addEventListener('DOMContentLoaded', loadLanguages);
        
        async function loadLanguages() {
            try {
                const response = await fetch(`${API_BASE}/languages`);
                const languages = await response.json();
                
                const sourceSelect = document.getElementById('sourceLang');
                const targetSelect = document.getElementById('targetLang');
                
                // Populate source languages
                for (const [code, name] of Object.entries(languages)) {
                    const option = document.createElement('option');
                    option.value = code;
                    option.textContent = name;
                    sourceSelect.appendChild(option);
                }
                
                // Populate target languages
                for (const [code, name] of Object.entries(languages)) {
                    if (code !== 'auto') {
                        const option = document.createElement('option');
                        option.value = code;
                        option.textContent = name;
                        targetSelect.appendChild(option);
                    }
                }
            } catch (error) {
                showError('Failed to load languages');
            }
        }
        
        async function translateText() {
            const text = document.getElementById('sourceText').value.trim();
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            
            if (!text) {
                showError('Please enter text to translate');
                return;
            }
            
            showLoader(true);
            hideError();
            
            try {
                const response = await fetch(`${API_BASE}/translate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        source_lang: sourceLang,
                        target_lang: targetLang
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Translation failed');
                }
                
                const result = await response.json();
                document.getElementById('translatedText').value = result.translated;
                showSuccess('Translation completed! ✓');
            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                showLoader(false);
            }
        }
        
        function copyToClipboard() {
            const translatedText = document.getElementById('translatedText').value;
            
            if (!translatedText) {
                showError('No translation to copy');
                return;
            }
            
            navigator.clipboard.writeText(translatedText).then(() => {
                showSuccess('Translation copied to clipboard! ✓');
            }).catch(() => {
                showError('Failed to copy');
            });
        }
        
        function clearAll() {
            document.getElementById('sourceText').value = '';
            document.getElementById('translatedText').value = '';
            document.getElementById('sourceLang').value = 'auto';
            document.getElementById('targetLang').value = 'en';
            hideError();
        }
        
        function speakSource() {
            const text = document.getElementById('sourceText').value;
            const lang = document.getElementById('sourceLang').value;
            speak(text, lang === 'auto' ? 'en' : lang);
        }
        
        function speakTranslated() {
            const text = document.getElementById('translatedText').value;
            const lang = document.getElementById('targetLang').value;
            speak(text, lang);
        }
        
        function speak(text, language) {
            if (!text) {
                showError('No text to speak');
                return;
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = language;
            window.speechSynthesis.speak(utterance);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
